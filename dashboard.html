<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Piemonte · Caixa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
  :root{
    --pine:#1E2A20; --pine-deep:#152018; --paper:#FAF7F1; --paper-dim:#F1ECE1;
    --ink:#24261F; --wine:#8C3B2E; --wine-dark:#732E23; --olive:#5E6B45;
    --gold:#C79A3B; --line:#E4DFD3; --green-ok:#3F6B44;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:'Inter',sans-serif; background:var(--paper-dim); color:var(--ink); min-height:100vh; padding-bottom:60px;}
  header{background:var(--pine); color:#fff; padding:16px 20px; display:flex; align-items:center; justify-content:space-between;}
  header h1{font-family:'Fraunces',serif; font-weight:600; font-size:1.3rem; margin:0; letter-spacing:0.01em;}
  header button{background:transparent; border:1px solid rgba(255,255,255,0.35); color:#fff; padding:7px 14px; border-radius:3px; font-family:inherit; font-size:0.8rem; cursor:pointer;}
  header button:hover{background:rgba(255,255,255,0.1);}

  main{max-width:720px; margin:0 auto; padding:20px 16px;}

  .month-summary { background:var(--pine-deep); color:#fff; border-radius:6px; padding:16px 20px; margin-bottom:24px; box-shadow:0 10px 20px -10px rgba(0,0,0,0.3); }
  .ms-title { font-size:0.8rem; text-transform:uppercase; letter-spacing:0.05em; color:#B4C4B7; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;}
  .ms-title > span.ms-label { display:flex; align-items:center; gap:6px; }
  .ms-controls { display:flex; align-items:center; gap:6px; text-transform:none; letter-spacing:0; }
  .ms-controls select{
    background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.25); color:#fff;
    padding:6px 8px; border-radius:4px; font-family:'Inter',sans-serif; font-size:0.78rem; cursor:pointer;
  }
  .ms-controls select:focus{outline:none; border-color:var(--gold);}
  .ms-controls select option{ color:var(--ink); }
  .btn-mes-atual{
    display:none; background:transparent; border:1px solid rgba(255,255,255,0.3); color:#EAD9A8;
    padding:6px 10px; border-radius:4px; font-family:'Inter',sans-serif; font-size:0.72rem; cursor:pointer; white-space:nowrap;
  }
  .btn-mes-atual.show{ display:inline-block; }
  .btn-mes-atual:hover{ background:rgba(255,255,255,0.1); }
  .ms-grid { display:flex; justify-content:space-between; gap:10px; }
  .ms-item { display:flex; flex-direction:column; gap:4px; font-size:0.8rem; color:#B4C4B7;}
  .ms-item b { font-family:'Fraunces',serif; font-size:1.2rem; font-weight:600; color:#fff;}
  .ms-item b.red { color:#E4897B; }
  .ms-item b.green { color:#8FCB99; }

  .date-nav{display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:20px; position:relative;}
  .date-nav button.nav-btn{background:#fff; border:1px solid var(--line); width:36px; height:36px; border-radius:50%; font-size:1rem; cursor:pointer; color:var(--pine);}
  .date-nav button.nav-btn:hover{background:#fff;}
  .date-label{text-align:center; min-width:220px; position:relative;}
  .date-label .dia-wrap {display:flex; align-items:center; justify-content:center; gap:8px;}
  .date-label .dia{font-family:'Fraunces',serif; font-size:1.15rem; font-weight:600; text-transform:capitalize; padding:3px 10px; border-radius:14px; transition:background 0.15s, color 0.15s;}
  .date-label .dia.dia-lucro{ background:rgba(63,107,68,0.12); color:var(--green-ok); }
  .date-label .dia.dia-prejuizo{ background:rgba(140,59,46,0.1); color:var(--wine-dark); }

  .icon-picker {background:none; border:none; font-size:1.2rem; cursor:pointer; padding:2px;}
  .date-label .hoje-link{display:none; font-size:0.75rem; color:var(--wine); cursor:pointer; margin-top:2px;}
  .date-label .hoje-link.show{display:block;}

  .hidden-picker { position:absolute; opacity:0; width:0; height:0; border:none; pointer-events:none; }

  .summary{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:22px;}
  .sum-card{background:#fff; border:1px solid var(--line); border-radius:4px; padding:14px 16px;}
  .sum-card .label{font-size:0.72rem; color:var(--olive); font-weight:500; text-transform:uppercase; letter-spacing:0.03em;}
  .sum-card .value{font-family:'Fraunces',serif; font-size:1.5rem; font-weight:600; margin-top:4px;}
  .sum-card.saldo .value{color:var(--green-ok);}
  .sum-card.gastos .value{color:var(--wine-dark);}
  .breakdown{grid-column:1 / -1; display:flex; gap:8px; flex-wrap:wrap;}
  .pill-stat{background:#fff; border:1px solid var(--line); border-radius:20px; padding:6px 12px; font-size:0.78rem; color:var(--ink); display:flex; gap:6px;}
  .pill-stat b{color:var(--pine);}

  .actions{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:26px;}
  .action-btn{padding:16px 10px; border:none; border-radius:4px; font-family:inherit; font-weight:600; font-size:0.95rem; cursor:pointer; color:#fff;}
  .action-btn.entrada{background:var(--olive);}
  .action-btn.entrada:hover{background:#4c5738;}
  .action-btn.gasto{background:var(--wine);}
  .action-btn.gasto:hover{background:var(--wine-dark);}

  section.list-section{margin-bottom:24px;}
  section.list-section h2{font-size:0.85rem; text-transform:uppercase; letter-spacing:0.04em; color:var(--olive); margin:0 0 10px;}
  .row-item{background:#fff; border:1px solid var(--line); border-radius:4px; padding:12px 14px; display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
  .row-item .desc{font-size:0.9rem;}
  .row-item .desc .tag{display:inline-block; font-size:0.65rem; text-transform:uppercase; letter-spacing:0.03em; color:var(--olive); margin-right:6px; background:#F1ECE1; padding:2px 6px; border-radius:3px;}
  .row-item .right{display:flex; align-items:center; gap:8px;}
  .row-item .valor{font-weight:600; margin-right:4px;}
  .icon-btn{background:none; border:none; color:#B4A99A; cursor:pointer; font-size:1.1rem; padding:4px;}
  .icon-btn:hover{color:var(--wine);}
  .icon-btn.edit:hover{color:var(--pine);}
  .empty{color:#A79E8C; font-size:0.85rem; padding:8px 2px;}

  .overlay{position:fixed; inset:0; background:rgba(21,32,24,0.55); display:none; align-items:flex-end; justify-content:center; z-index:50;}
  .overlay.show{display:flex;}
  @media(min-width:560px){.overlay{align-items:center;}}
  .modal{background:var(--paper); width:100%; max-width:440px; border-radius:10px 10px 0 0; padding:22px 20px 26px; max-height:88vh; overflow-y:auto;}
  @media(min-width:560px){.modal{border-radius:8px;}}
  .modal h3{font-family:'Fraunces',serif; font-size:1.2rem; margin:0 0 16px;}
  
  .pillrow{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
  .pillbtn{flex:1 1 auto; padding:10px 12px; border:1.5px solid var(--line); background:#fff; border-radius:5px; font-family:inherit; font-size:0.85rem; font-weight:500; cursor:pointer; color:var(--ink);}
  .pillbtn.active{border-color:var(--pine); background:var(--pine); color:#fff;}
  
  label{display:block; font-size:0.78rem; font-weight:500; color:var(--olive); margin:14px 0 6px;}
  input[type=text], select{width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:5px; font-family:inherit; font-size:0.95rem; background:#fff; color:var(--ink);}
  input:focus, select:focus{outline:none; border-color:var(--wine);}
  .select-row{display:flex; gap:8px; align-items:center;}
  .select-row select{flex:1;}
  .gear-btn{width:42px; height:42px; flex:none; border-radius:5px; border:1px solid var(--line); background:#fff; cursor:pointer; font-size:1.05rem;}
  
  .modal-actions{display:flex; gap:10px; margin-top:22px;}
  .modal-actions button{flex:1; padding:12px; border:none; border-radius:5px; font-family:inherit; font-weight:600; cursor:pointer;}
  .btn-cancel{background:transparent; border:1px solid var(--line) !important; color:var(--olive);}
  .btn-save{background:var(--pine); color:#fff;}
  .modal-err{color:var(--wine-dark); font-size:0.82rem; margin-top:10px; min-height:1.1em;}

  .manage-list{margin-top:14px; max-height:220px; overflow-y:auto;}
  .manage-item{display:flex; justify-content:space-between; align-items:center; padding:9px 4px; border-bottom:1px solid var(--line); font-size:0.88rem;}
  .manage-item button{background:none; border:none; color:#B4A99A; cursor:pointer;}
  .manage-item button:hover{color:var(--wine);}
  .add-row{display:flex; gap:8px; margin-top:12px;}
  .add-row input{flex:1;}
  .add-row button{padding:0 16px; border:none; border-radius:5px; background:var(--olive); color:#fff; font-weight:600; cursor:pointer;}
</style>
</head>
<body>

<header>
  <h1>Piemonte</h1>
  <button id="btnLogout">Sair</button>
</header>

<main>
  <div class="month-summary">
    <div class="ms-title">
      <span class="ms-label">Resumo do Mês</span>
      <div class="ms-controls">
        <button class="btn-mes-atual" id="btnMesAtual">mês atual</button>
        <select id="selectMes"></select>
        <select id="selectAno"></select>
      </div>
    </div>
    <div class="ms-grid">
      <div class="ms-item">Entradas <b id="mesEntradas">R$ 0,00</b></div>
      <div class="ms-item">Saídas <b class="red" id="mesSaidas">R$ 0,00</b></div>
      <div class="ms-item">Lucro <b id="mesLucro">R$ 0,00</b></div>
    </div>
  </div>

  <div class="date-nav">
    <button class="nav-btn" id="prevDay">‹</button>
    <div class="date-label">
      <div class="dia-wrap">
        <span class="dia" id="diaLabel">—</span>
        <button class="icon-picker" id="btnPickData">📅</button>
        <input type="date" id="pickerData" class="hidden-picker">
      </div>
      <div class="hoje-link" id="hojeLink">voltar para hoje</div>
    </div>
    <button class="nav-btn" id="nextDay">›</button>
  </div>

  <div class="summary">
    <div class="sum-card">
      <div class="label">Total entradas</div>
      <div class="value" id="totalEntradas">R$ 0,00</div>
    </div>
    <div class="sum-card gastos">
      <div class="label">Total gastos</div>
      <div class="value" id="totalGastos">R$ 0,00</div>
    </div>
    <div class="sum-card saldo" style="grid-column:1 / -1;">
      <div class="label">Saldo do dia</div>
      <div class="value" id="saldoDia">R$ 0,00</div>
    </div>
    <div class="breakdown" id="breakdown"></div>
  </div>

  <div class="actions">
    <button class="action-btn entrada" id="btnAbrirEntrada">+ Dinheiro no caixa</button>
    <button class="action-btn gasto" id="btnAbrirGasto">+ Gasto</button>
  </div>

  <section class="list-section">
    <h2>Entradas</h2>
    <div id="listaEntradas"></div>
  </section>

  <section class="list-section">
    <h2>Gastos</h2>
    <div id="listaGastos"></div>
  </section>
</main>

<!-- ===== Modal: Entrada ===== -->
<div class="overlay" id="overlayEntrada">
  <div class="modal">
    <h3 id="tituloModalEntrada">Dinheiro no caixa</h3>
    
    <label>Turno</label>
    <div class="pillrow" id="turnoPills">
      <button class="pillbtn active" data-val="Dia">Dia</button>
      <button class="pillbtn" data-val="Noite">Noite</button>
    </div>
    
    <label>Modalidade</label>
    <div class="pillrow" id="modalidadePills">
      <button class="pillbtn active" data-val="Salão">Salão</button>
      <button class="pillbtn" data-val="Tele">Tele</button>
    </div>

    <label>Forma de pagamento</label>
    <div class="pillrow" id="formaPagamentoPills">
      <button class="pillbtn" data-fp="dinheiro">Dinheiro</button>
      <button class="pillbtn" data-fp="cartao">Cartão</button>
      <button class="pillbtn" data-fp="ifood">iFood</button>
      <button class="pillbtn" data-fp="99">99</button>
    </div>
    
    <label>Valor (R$)</label>
    <input type="text" id="entradaValor" inputmode="numeric" placeholder="0,00">
    <div class="modal-err" id="entradaErr"></div>
    <div class="modal-actions">
      <button class="btn-cancel" data-close="overlayEntrada">Cancelar</button>
      <button class="btn-save" id="btnSalvarEntrada">Salvar</button>
    </div>
  </div>
</div>

<!-- ===== Modal: Gasto ===== -->
<div class="overlay" id="overlayGasto">
  <div class="modal">
    <h3 id="tituloModalGasto">Novo gasto</h3>
    <label>Categoria</label>
    <div class="pillrow" id="categoriaPills">
      <button class="pillbtn" data-cat="fornecedor">Fornecedor</button>
      <button class="pillbtn" data-cat="funcionario">Funcionário</button>
      <button class="pillbtn" data-cat="particular">Particular</button>
      <button class="pillbtn" data-cat="outros">Outros</button>
    </div>

    <div id="gastoSelectWrap" style="display:none;">
      <label id="gastoSelectLabel">Selecionar</label>
      <div class="select-row">
        <select id="gastoSelect"></select>
        <button class="gear-btn" id="btnGerenciarLista" title="Gerenciar lista">⚙</button>
      </div>
    </div>

    <div id="gastoOutrosWrap" style="display:none;">
      <label>Descrição</label>
      <input type="text" id="gastoDescricao" placeholder="Ex: manutenção da geladeira">
    </div>

    <div id="gastoObsWrap" style="display:none;">
      <label>Observação (opcional)</label>
      <input type="text" id="gastoObservacao" placeholder="Ex: adiantamento, motivo, detalhe...">
    </div>

    <label>Valor (R$)</label>
    <input type="text" id="gastoValor" inputmode="numeric" placeholder="0,00">
    <div class="modal-err" id="gastoErr"></div>
    <div class="modal-actions">
      <button class="btn-cancel" data-close="overlayGasto">Cancelar</button>
      <button class="btn-save" id="btnSalvarGasto">Salvar</button>
    </div>
  </div>
</div>

<!-- ===== Modal: Gerenciar ===== -->
<div class="overlay" id="overlayGerenciar">
  <div class="modal">
    <h3 id="gerenciarTitulo">Gerenciar</h3>
    <div class="manage-list" id="gerenciarLista"></div>
    <div class="add-row">
      <input type="text" id="gerenciarNovoNome" placeholder="Nome">
      <button id="btnGerenciarAdicionar">Adicionar</button>
    </div>
    <div class="modal-err" id="gerenciarErr"></div>
    <div class="modal-actions">
      <button class="btn-cancel" data-close="overlayGerenciar" style="flex:none;width:100%;">Fechar</button>
    </div>
  </div>
</div>

<script>
let currentUser = null;
(async () => {
  const { data } = await db.auth.getSession();
  if (!data.session) { window.location.href = 'index.html'; return; }
  currentUser = data.session.user;
})();
document.getElementById('btnLogout').addEventListener('click', async () => {
  await db.auth.signOut();
  window.location.href = 'index.html';
});

const fmtBRL = (n) => (n || 0).toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
const toDateStr = (d) => { const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; };
const isSameDay = (a,b) => toDateStr(a) === toDateStr(b);

function mascaraMoeda(e) {
  let v = e.target.value.replace(/\D/g, '');
  if(v === '') { e.target.value = ''; return; }
  v = (parseInt(v, 10) / 100).toFixed(2);
  e.target.value = v.replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, ".");
}
function parseMoeda(str) {
  if(!str) return 0;
  return parseFloat(str.replace(/\./g, '').replace(',', '.'));
}
document.getElementById('entradaValor').addEventListener('input', mascaraMoeda);
document.getElementById('gastoValor').addEventListener('input', mascaraMoeda);

let currentDate = new Date();
let currentMesDate = new Date(); // Controla apenas o calendário do resumo mensal
let entradasDoDia = [];
let gastosDoDia = []; 

// ---------- Pickers de Calendário ----------
document.getElementById('btnPickData').addEventListener('click', () => {
  try { document.getElementById('pickerData').showPicker(); } catch(e) { document.getElementById('pickerData').focus(); }
});
document.getElementById('pickerData').addEventListener('change', (e) => {
  if(e.target.value){
    const [y, m, d] = e.target.value.split('-');
    currentDate = new Date(y, m-1, d);
    currentMesDate = new Date(y, m-1, 1); // Sincroniza o mês lá de cima também
    refresh();
  }
});

// ---------- Selects de Mês/Ano (resumo mensal) ----------
const nomesMeses = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
(function initMesSelects(){
  const selMes = document.getElementById('selectMes');
  selMes.innerHTML = nomesMeses.map((n, i) => `<option value="${i}">${n}</option>`).join('');

  const selAno = document.getElementById('selectAno');
  const anoAtual = new Date().getFullYear();
  const anos = [];
  for (let a = anoAtual - 4; a <= anoAtual + 1; a++) anos.push(a);
  selAno.innerHTML = anos.map(a => `<option value="${a}">${a}</option>`).join('');
})();

function syncMesSelects(){
  document.getElementById('selectMes').value = currentMesDate.getMonth();
  document.getElementById('selectAno').value = currentMesDate.getFullYear();
  const hoje = new Date();
  const ehMesAtual = currentMesDate.getMonth() === hoje.getMonth() && currentMesDate.getFullYear() === hoje.getFullYear();
  document.getElementById('btnMesAtual').classList.toggle('show', !ehMesAtual);
}

function onMesAnoChange(){
  const m = Number(document.getElementById('selectMes').value);
  const a = Number(document.getElementById('selectAno').value);
  currentMesDate = new Date(a, m, 1);
  syncMesSelects();
  refreshMes(); // Atualiza SÓ a caixinha do mês, sem mudar a data do caixa
}
document.getElementById('selectMes').addEventListener('change', onMesAnoChange);
document.getElementById('selectAno').addEventListener('change', onMesAnoChange);
document.getElementById('btnMesAtual').addEventListener('click', () => {
  currentMesDate = new Date();
  syncMesSelects();
  refreshMes();
});

function renderDateLabel(){
  document.getElementById('diaLabel').textContent = currentDate.toLocaleDateString('pt-BR', { weekday:'short', day:'numeric', month:'long' });
  document.getElementById('hojeLink').classList.toggle('show', !isSameDay(currentDate, new Date()));
  document.getElementById('pickerData').value = toDateStr(currentDate);
}
document.getElementById('prevDay').addEventListener('click', () => { currentDate.setDate(currentDate.getDate()-1); currentMesDate = new Date(currentDate); refresh(); });
document.getElementById('nextDay').addEventListener('click', () => { currentDate.setDate(currentDate.getDate()+1); currentMesDate = new Date(currentDate); refresh(); });
document.getElementById('hojeLink').addEventListener('click', () => { currentDate = new Date(); currentMesDate = new Date(); refresh(); });

let cache = { fornecedor: [], funcionario: [], particular: [] };
const tableFor = { fornecedor:'fornecedores', funcionario:'funcionarios', particular:'particulares' };
const labelFor = { fornecedor:'Fornecedor', funcionario:'Funcionário', particular:'Particular' };

async function loadCache(){
  for (const cat of ['fornecedor','funcionario','particular']){
    const { data } = await db.from(tableFor[cat]).select('*').eq('ativo', true).order('nome');
    cache[cat] = data || [];
  }
}

async function refreshMes() {
  const ano = currentMesDate.getFullYear();
  const mes = String(currentMesDate.getMonth()+1).padStart(2,'0');
  const lastDay = new Date(ano, currentMesDate.getMonth() + 1, 0).getDate();
  const startMes = `${ano}-${mes}-01`;
  const endMes = `${ano}-${mes}-${lastDay}`;

  syncMesSelects();

  const [resMesEnt, resMesGas] = await Promise.all([
    db.from('entradas').select('valor').gte('data', startMes).lte('data', endMes),
    db.from('gastos').select('valor').gte('data', startMes).lte('data', endMes)
  ]);

  const totE = (resMesEnt.data || []).reduce((s,x) => s + Number(x.valor), 0);
  const totG = (resMesGas.data || []).reduce((s,x) => s + Number(x.valor), 0);
  const lucroMes = totE - totG;
  document.getElementById('mesEntradas').textContent = fmtBRL(totE);
  document.getElementById('mesSaidas').textContent = fmtBRL(totG);
  const elLucroMes = document.getElementById('mesLucro');
  elLucroMes.textContent = fmtBRL(lucroMes);
  elLucroMes.classList.toggle('green', lucroMes >= 0);
  elLucroMes.classList.toggle('red', lucroMes < 0);
}

async function refresh(){
  renderDateLabel();
  await refreshMes();
  const dateStr = toDateStr(currentDate);

  const [resDiaEnt, resDiaGas] = await Promise.all([
    db.from('entradas').select('*').eq('data', dateStr).order('created_at', { ascending:false }),
    db.from('gastos').select('*').eq('data', dateStr).order('created_at', { ascending:false })
  ]);

  entradasDoDia = resDiaEnt.data || [];
  gastosDoDia = resDiaGas.data || [];
  
  renderSummary(entradasDoDia, gastosDoDia);
  renderListaEntradas(entradasDoDia);
  renderListaGastos(gastosDoDia);
}

const fpLabel = { dinheiro:'Dinheiro', cartao:'Cartão', ifood:'iFood', '99':'99' };

function renderSummary(entradas, gastos){
  const tE = entradas.reduce((s,e) => s + Number(e.valor), 0);
  const tG = gastos.reduce((s,g) => s + Number(g.valor), 0);
  const saldo = tE - tG;
  document.getElementById('totalEntradas').textContent = fmtBRL(tE);
  document.getElementById('totalGastos').textContent = fmtBRL(tG);
  const elSaldo = document.getElementById('saldoDia');
  elSaldo.textContent = fmtBRL(saldo);
  elSaldo.style.color = saldo < 0 ? 'var(--wine-dark)' : 'var(--green-ok)';

  // Colore o dia no seletor de data: verde (lucro), vermelho (prejuízo), neutro (sem lançamentos ainda)
  const diaEl = document.getElementById('diaLabel');
  diaEl.classList.remove('dia-lucro', 'dia-prejuizo');
  if (entradas.length || gastos.length) {
    diaEl.classList.add(saldo >= 0 ? 'dia-lucro' : 'dia-prejuizo');
  }

  const byForma = {};
  entradas.forEach(e => byForma[e.forma_pagamento] = (byForma[e.forma_pagamento]||0) + Number(e.valor));
  document.getElementById('breakdown').innerHTML = Object.keys(fpLabel).map(fp =>
    `<div class="pill-stat">${fpLabel[fp]} <b>${fmtBRL(byForma[fp]||0)}</b></div>`
  ).join('');
}

function renderListaEntradas(entradas){
  const el = document.getElementById('listaEntradas');
  if (!entradas.length){ el.innerHTML = '<div class="empty">Nenhuma entrada lançada.</div>'; return; }
  el.innerHTML = entradas.map(e => `
    <div class="row-item">
      <div class="desc">
        <span class="tag">${fpLabel[e.forma_pagamento]}</span>
        ${e.observacao ? `<span class="tag" style="background:#E2E8E4;">${e.observacao}</span>` : ''}
      </div>
      <div class="right">
        <span class="valor">${fmtBRL(e.valor)}</span>
        <button class="icon-btn edit" data-edit-entrada="${e.id}">✎</button>
        <button class="icon-btn" data-del-entrada="${e.id}">✕</button>
      </div>
    </div>`).join('');
  
  el.querySelectorAll('[data-del-entrada]').forEach(btn => btn.addEventListener('click', async () => {
    if (!confirm('Excluir esta entrada?')) return;
    await db.from('entradas').delete().eq('id', btn.dataset.delEntrada);
    refresh();
  }));

  el.querySelectorAll('[data-edit-entrada]').forEach(btn => btn.addEventListener('click', () => {
    const e = entradasDoDia.find(x => x.id === btn.dataset.editEntrada);
    abrirModalEntrada(e);
  }));
}

function nomeGasto(g){
  if (g.categoria === 'outros') return g.descricao || 'Outros';
  const item = cache[g.categoria]?.find(i => i.id === g[g.categoria+'_id']);
  return item ? item.nome : '(removido)';
}

function renderListaGastos(gastos){
  const el = document.getElementById('listaGastos');
  if (!gastos.length){ el.innerHTML = '<div class="empty">Nenhum gasto lançado.</div>'; return; }
  el.innerHTML = gastos.map(g => `
    <div class="row-item">
      <div class="desc"><span class="tag">${labelFor[g.categoria] || 'Outros'}</span>${nomeGasto(g)}${g.observacao ? `<span class="tag" style="background:#E2E8E4;">${g.observacao}</span>` : ''}</div>
      <div class="right">
        <span class="valor">${fmtBRL(g.valor)}</span>
        <button class="icon-btn edit" data-edit-gasto="${g.id}">✎</button>
        <button class="icon-btn" data-del-gasto="${g.id}">✕</button>
      </div>
    </div>`).join('');
  
  el.querySelectorAll('[data-del-gasto]').forEach(btn => btn.addEventListener('click', async () => {
    if (!confirm('Excluir este gasto?')) return;
    await db.from('gastos').delete().eq('id', btn.dataset.delGasto);
    refresh();
  }));

  el.querySelectorAll('[data-edit-gasto]').forEach(btn => btn.addEventListener('click', () => {
    const g = gastosDoDia.find(x => x.id === btn.dataset.editGasto);
    abrirModalGasto(g);
  }));
}

// ---------- Selectors para Pills ----------
function setupPills(containerId, varObj, varKey){
  document.getElementById(containerId).addEventListener('click', (e) => {
    const btn = e.target.closest('.pillbtn'); if (!btn) return;
    document.querySelectorAll(`#${containerId} .pillbtn`).forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    varObj[varKey] = btn.dataset.val || btn.dataset.fp || btn.dataset.cat;
    if(varObj.onChange) varObj.onChange(varObj[varKey]);
  });
}

// ---------- Entrada ----------
let estEntrada = { turno:'Dia', mod:'Salão', fp:null, editId:null };
setupPills('turnoPills', estEntrada, 'turno');
setupPills('modalidadePills', estEntrada, 'mod');
setupPills('formaPagamentoPills', estEntrada, 'fp');

function abrirModalEntrada(edit = null) {
  estEntrada.editId = edit ? edit.id : null;
  document.getElementById('tituloModalEntrada').textContent = edit ? 'Editar Entrada' : 'Dinheiro no caixa';
  document.getElementById('entradaErr').textContent = '';

  if (edit) {
    const infos = (edit.observacao || 'Dia | Salão').split(' | ');
    estEntrada.turno = infos[0] || 'Dia';
    estEntrada.mod = infos[1] || 'Salão';
    estEntrada.fp = edit.forma_pagamento;

    document.querySelectorAll('#turnoPills .pillbtn').forEach(b => b.classList.toggle('active', b.dataset.val === estEntrada.turno));
    document.querySelectorAll('#modalidadePills .pillbtn').forEach(b => b.classList.toggle('active', b.dataset.val === estEntrada.mod));
    document.querySelectorAll('#formaPagamentoPills .pillbtn').forEach(b => b.classList.toggle('active', b.dataset.fp === estEntrada.fp));
    
    document.getElementById('entradaValor').value = (edit.valor).toFixed(2).replace('.',',');
    mascaraMoeda({target: document.getElementById('entradaValor')});
  } else {
    estEntrada.fp = null;
    document.querySelectorAll('#formaPagamentoPills .pillbtn').forEach(b => b.classList.remove('active'));
    document.getElementById('entradaValor').value = '';
  }

  document.getElementById('overlayEntrada').classList.add('show');
  setTimeout(() => document.getElementById('entradaValor').focus(), 100);
}

document.getElementById('btnAbrirEntrada').addEventListener('click', () => abrirModalEntrada(null));

document.getElementById('btnSalvarEntrada').addEventListener('click', async () => {
  const vNum = parseMoeda(document.getElementById('entradaValor').value);
  const err = document.getElementById('entradaErr');
  if (!estEntrada.fp) { err.textContent = 'Escolha a forma de pagamento.'; return; }
  if (!vNum || vNum <= 0) { err.textContent = 'Informe um valor válido.'; return; }
  
  err.textContent = 'Salvando...';
  const payload = {
    data: toDateStr(currentDate),
    forma_pagamento: estEntrada.fp,
    valor: vNum,
    observacao: `${estEntrada.turno} | ${estEntrada.mod}`
  };

  if (estEntrada.editId) {
    await db.from('entradas').update(payload).eq('id', estEntrada.editId);
  } else {
    payload.created_by = currentUser?.id;
    await db.from('entradas').insert(payload);
  }

  document.getElementById('overlayEntrada').classList.remove('show');
  refresh();
});

// ---------- Gasto ----------
let estGasto = { cat:null, editId:null, onChange: (c) => {
  const sel = document.getElementById('gastoSelectWrap'), out = document.getElementById('gastoOutrosWrap'), obs = document.getElementById('gastoObsWrap');
  if (c === 'outros'){ sel.style.display = 'none'; out.style.display = 'block'; obs.style.display = 'none'; }
  else if(c){ out.style.display = 'none'; sel.style.display = 'block'; document.getElementById('gastoSelectLabel').textContent = labelFor[c]; populateSelect(c); obs.style.display = (c === 'particular') ? 'block' : 'none'; }
}};
setupPills('categoriaPills', estGasto, 'cat');

function populateSelect(cat){
  const sel = document.getElementById('gastoSelect');
  const items = cache[cat] || [];
  sel.innerHTML = items.length ? items.map(i => `<option value="${i.id}">${i.nome}</option>`).join('') : `<option value="">Vazio (use a engrenagem)</option>`;
}

function abrirModalGasto(gastoEdit = null) {
  estGasto.editId = gastoEdit ? gastoEdit.id : null;
  document.getElementById('tituloModalGasto').textContent = gastoEdit ? 'Editar Gasto' : 'Novo Gasto';
  document.getElementById('gastoErr').textContent = '';
  
  const catToSelect = gastoEdit ? gastoEdit.categoria : null;
  document.querySelectorAll('#categoriaPills .pillbtn').forEach(b => {
    b.classList.toggle('active', b.dataset.cat === catToSelect);
  });
  estGasto.cat = catToSelect;
  estGasto.onChange(catToSelect);

  if (gastoEdit) {
    document.getElementById('gastoValor').value = (gastoEdit.valor).toFixed(2).replace('.',',');
    mascaraMoeda({target: document.getElementById('gastoValor')});
    if(catToSelect === 'outros') document.getElementById('gastoDescricao').value = gastoEdit.descricao || '';
    else document.getElementById('gastoSelect').value = gastoEdit[`${catToSelect}_id`];
    document.getElementById('gastoObservacao').value = gastoEdit.observacao || '';
  } else {
    document.getElementById('gastoValor').value = '';
    document.getElementById('gastoDescricao').value = '';
    document.getElementById('gastoObservacao').value = '';
  }
  
  document.getElementById('overlayGasto').classList.add('show');
  setTimeout(() => document.getElementById('gastoValor').focus(), 100);
}

document.getElementById('btnAbrirGasto').addEventListener('click', () => abrirModalGasto(null));
document.getElementById('btnGerenciarLista').addEventListener('click', () => { if (estGasto.cat && estGasto.cat !== 'outros') abrirGerenciar(estGasto.cat); });

document.getElementById('btnSalvarGasto').addEventListener('click', async () => {
  const vNum = parseMoeda(document.getElementById('gastoValor').value);
  const err = document.getElementById('gastoErr');
  if (!estGasto.cat) { err.textContent = 'Escolha a categoria.'; return; }
  if (!vNum || vNum <= 0) { err.textContent = 'Informe um valor válido.'; return; }

  const payload = { data: toDateStr(currentDate), categoria: estGasto.cat, valor: vNum };
  if (estGasto.cat === 'outros'){
    const desc = document.getElementById('gastoDescricao').value.trim();
    if (!desc) { err.textContent = 'Descreva o gasto.'; return; }
    payload.descricao = desc;
  } else {
    const selId = document.getElementById('gastoSelect').value;
    if (!selId) { err.textContent = 'Selecione um item (ou cadastre).'; return; }
    payload[estGasto.cat + '_id'] = selId;
  }
  if (estGasto.cat === 'particular'){
    const obs = document.getElementById('gastoObservacao').value.trim();
    payload.observacao = obs || null;
  }

  err.textContent = 'Salvando...';
  if (estGasto.editId) {
    await db.from('gastos').update(payload).eq('id', estGasto.editId);
  } else {
    payload.created_by = currentUser?.id;
    await db.from('gastos').insert(payload);
  }
  
  document.getElementById('overlayGasto').classList.remove('show');
  refresh();
});

// ---------- Gerenciar ----------
let gerenciarCatAtual = null;
async function abrirGerenciar(cat){
  gerenciarCatAtual = cat;
  document.getElementById('gerenciarTitulo').textContent = 'Gerenciar ' + labelFor[cat].toLowerCase() + 's';
  document.getElementById('gerenciarNovoNome').value = '';
  document.getElementById('gerenciarErr').textContent = '';
  renderGerenciarLista();
  document.getElementById('overlayGerenciar').classList.add('show');
  setTimeout(() => document.getElementById('gerenciarNovoNome').focus(), 100);
}
function renderGerenciarLista(){
  const el = document.getElementById('gerenciarLista');
  const items = cache[gerenciarCatAtual] || [];
  el.innerHTML = items.length ? items.map(i => `<div class="manage-item">${i.nome}<button data-remove="${i.id}">remover</button></div>`).join('') : '<div class="empty">Nada cadastrado.</div>';
  el.querySelectorAll('[data-remove]').forEach(btn => btn.addEventListener('click', async () => {
    await db.from(tableFor[gerenciarCatAtual]).update({ ativo:false }).eq('id', btn.dataset.remove);
    await loadCache(); renderGerenciarLista(); if (estGasto.cat === gerenciarCatAtual) populateSelect(gerenciarCatAtual);
  }));
}
document.getElementById('btnGerenciarAdicionar').addEventListener('click', async () => {
  const nome = document.getElementById('gerenciarNovoNome').value.trim();
  if (!nome) return;
  await db.from(tableFor[gerenciarCatAtual]).insert({ nome });
  document.getElementById('gerenciarNovoNome').value = '';
  await loadCache(); renderGerenciarLista(); if (estGasto.cat === gerenciarCatAtual) populateSelect(gerenciarCatAtual);
});

// ---------- Teclas de Atalho ----------
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') document.querySelectorAll('.overlay').forEach(ov => ov.classList.remove('show'));
});
function addEnter(idInput, idBtn) {
  document.getElementById(idInput).addEventListener('keydown', (e) => { if(e.key === 'Enter') { e.preventDefault(); document.getElementById(idBtn).click(); }});
}
addEnter('entradaValor', 'btnSalvarEntrada');
addEnter('gastoValor', 'btnSalvarGasto');
addEnter('gastoDescricao', 'btnSalvarGasto');
addEnter('gastoObservacao', 'btnSalvarGasto');
addEnter('gerenciarNovoNome', 'btnGerenciarAdicionar');

document.querySelectorAll('[data-close]').forEach(btn => btn.addEventListener('click', () => document.getElementById(btn.dataset.close).classList.remove('show')));
document.querySelectorAll('.overlay').forEach(ov => ov.addEventListener('click', (e) => { if (e.target === ov) ov.classList.remove('show'); }));

(async () => { await loadCache(); await refresh(); })();
</script>
</body>
